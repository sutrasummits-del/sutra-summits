<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#060a12;
  --bg2:#0a1020;
  --card:rgba(16,25,40,.72);
  --card2:rgba(20,31,49,.78);

  --text:#f7f3ea;
  --muted:#a6b0c0;

  --gold:#d9b86c;
  --gold2:#f4dfa4;
  --blue:#526fa8;
  --purple:#765caa;

  --line:rgba(255,255,255,.10);
  --lineGold:rgba(217,184,108,.30);

  --shadow:0 25px 80px rgba(0,0,0,.35);
}

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(217,184,108,.12),
      transparent 25%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(82,111,168,.16),
      transparent 28%
    ),
    radial-gradient(
      circle at 50% 80%,
      rgba(118,92,170,.09),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #050810,
      #080d18 45%,
      #0a101d
    );

  color:var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  line-height:1.6;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;

  background-image:
    linear-gradient(
      rgba(255,255,255,.018) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.018) 1px,
      transparent 1px
    );

  background-size:70px 70px;

  mask-image:linear-gradient(
    to bottom,
    black,
    transparent 80%
  );
}

a{
  color:inherit;
  text-decoration:none;
}

::selection{
  background:var(--gold);
  color:#050505;
}

/* =========================================================
   AMBIENT LIGHTS
========================================================= */

.ambient{
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
  opacity:.12;
  z-index:-1;
}

.ambient.one{
  background:#d9b86c;
  top:5%;
  left:-180px;
}

.ambient.two{
  background:#526fa8;
  top:45%;
  right:-180px;
}

.ambient.three{
  background:#765caa;
  bottom:0;
  left:35%;
}

/* =========================================================
   NAV
========================================================= */

.nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;

  background:rgba(5,9,16,.68);
  backdrop-filter:blur(22px);

  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:17px 25px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:16px;
  font-weight:950;
  letter-spacing:.18em;
}

.logo span{
  color:var(--gold);
}

.nav-links{
  display:flex;
  gap:28px;

  color:#9da8b7;

  font-size:12px;
  font-weight:650;
}

.nav-links a{
  position:relative;
  transition:.25s ease;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-7px;

  width:0;
  height:1px;

  background:var(--gold);

  transition:.25s ease;
}

.nav-links a:hover{
  color:var(--gold2);
}

.nav-links a:hover::after{
  width:100%;
}

.nav-cta{
  padding:9px 15px;

  border:1px solid rgba(217,184,108,.35);
  border-radius:999px;

  color:var(--gold2);

  font-size:11px;
  font-weight:850;
  letter-spacing:.08em;
}

@media(max-width:850px){

  .nav-links{
    display:none;
  }

  .nav-cta{
    display:none;
  }

}

/* =========================================================
   COMMON
========================================================= */

.container{
  width:min(1160px,calc(100% - 42px));
  margin:auto;
}

section{
  padding:120px 0;
  position:relative;
}

.eyebrow{
  color:var(--gold);

  text-transform:uppercase;
  letter-spacing:.25em;

  font-size:10px;
  font-weight:900;
}

.section-title{
  font-size:clamp(42px,6vw,76px);
  line-height:.95;

  letter-spacing:-.065em;

  margin:14px 0 24px;
}

.section-title span{
  color:var(--gold);
}

.section-description{
  max-width:730px;

  color:var(--muted);

  font-size:17px;
}

.gold{
  color:var(--gold);
}

/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:100vh;

  display:flex;
  align-items:center;

  padding:150px 0 110px;

  position:relative;
  overflow:hidden;
}

.hero-orbit{
  position:absolute;

  width:650px;
  height:650px;

  right:-190px;
  top:80px;

  border:1px solid rgba(217,184,108,.11);
  border-radius:50%;

  box-shadow:
    0 0 0 80px rgba(217,184,108,.025),
    0 0 0 160px rgba(217,184,108,.018);
}

.hero-orbit::before{
  content:"";

  position:absolute;

  width:13px;
  height:13px;

  border-radius:50%;

  background:var(--gold);

  top:100px;
  left:70px;

  box-shadow:
    0 0 35px rgba(217,184,108,.9);
}

.hero-orbit::after{
  content:"";

  position:absolute;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#8097c5;

  bottom:80px;
  right:110px;

  box-shadow:
    0 0 25px rgba(82,111,168,.9);
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero-label{
  display:inline-flex;
  align-items:center;
  gap:10px;

  padding:9px 15px;

  border:1px solid rgba(217,184,108,.27);
  border-radius:999px;

  background:rgba(217,184,108,.035);

  color:var(--gold2);

  font-size:10px;
  font-weight:850;
  letter-spacing:.17em;

  margin-bottom:28px;
}

.hero-label::before{
  content:"";

  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--gold);

  box-shadow:0 0 14px var(--gold);
}

.hero h1{
  font-size:clamp(60px,10vw,130px);

  line-height:.84;

  letter-spacing:-.08em;

  max-width:950px;

  margin-bottom:36px;
}

.hero h1 span{
  color:var(--gold);
}

.hero-text{
  max-width:660px;

  color:var(--muted);

  font-size:20px;

  margin-bottom:34px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:14px 22px;

  border-radius:9px;

  background:
    linear-gradient(
      135deg,
      #f0d99b,
      #cba85d
    );

  color:#11100d;

  font-weight:900;
  font-size:13px;

  box-shadow:
    0 10px 35px rgba(217,184,108,.12);

  transition:.3s ease;
}

.btn:hover{
  transform:translateY(-4px);

  box-shadow:
    0 16px 45px rgba(217,184,108,.22);
}

.btn-outline{
  background:rgba(255,255,255,.025);

  color:var(--text);

  border:1px solid var(--line);

  box-shadow:none;
}

.btn-outline:hover{
  border-color:var(--lineGold);
  background:rgba(217,184,108,.05);
}

/* HERO STATS */

.hero-stats{
  display:flex;
  gap:45px;

  margin-top:65px;

  padding-top:25px;

  border-top:1px solid var(--line);

  max-width:700px;
}

.hero-stat strong{
  display:block;

  color:var(--gold2);

  font-size:22px;
}

.hero-stat span{
  color:#798496;

  font-size:10px;

  text-transform:uppercase;
  letter-spacing:.13em;
}

@media(max-width:600px){

  .hero-stats{
    gap:20px;
    flex-wrap:wrap;
  }

}

/* =========================================================
   MARQUEE
========================================================= */

.marquee{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);

  overflow:hidden;

  padding:17px 0;

  white-space:nowrap;

  color:#687386;

  text-transform:uppercase;
  letter-spacing:.22em;

  font-size:10px;
  font-weight:850;

  background:rgba(255,255,255,.012);
}

.marquee-track{
  display:inline-block;

  animation:scroll 28s linear infinite;
}

@keyframes scroll{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

/* =========================================================
   ABOUT
========================================================= */

.about-grid{
  display:grid;

  grid-template-columns:.75fr 1.4fr;

  gap:90px;

  align-items:start;
}

.about-number{
  font-size:170px;

  line-height:.65;

  font-weight:950;

  color:rgba(217,184,108,.08);

  user-select:none;
}

.about-copy{
  color:var(--muted);

  font-size:17px;
}

.about-copy p{
  margin-bottom:19px;
}

.about-highlight{
  margin-top:35px;

  padding:22px 24px;

  border-left:2px solid var(--gold);

  background:
    linear-gradient(
      90deg,
      rgba(217,184,108,.06),
      transparent
    );

  color:#d7dce4;

  font-size:15px;
}

@media(max-width:800px){

  .about-grid{
    grid-template-columns:1fr;
    gap:30px;
  }

  .about-number{
    font-size:100px;
  }

}

/* =========================================================
   CARDS
========================================================= */

.glass-card{
  border:1px solid var(--line);

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012)
    );

  backdrop-filter:blur(15px);

  box-shadow:var(--shadow);

  transition:.35s ease;
}

.glass-card:hover{
  transform:translateY(-6px);

  border-color:rgba(217,184,108,.25);

  box-shadow:
    0 30px 90px rgba(0,0,0,.42);
}

/* =========================================================
   EVENTS
========================================================= */

.events{
  background:
    radial-gradient(
      circle at 85% 50%,
      rgba(82,111,168,.08),
      transparent 30%
    );
}

.event-card{
  position:relative;

  overflow:hidden;

  margin-top:45px;

  padding:48px;

  border:1px solid rgba(217,184,108,.22);

  border-radius:27px;

  background:
    radial-gradient(
      circle at 90% 5%,
      rgba(217,184,108,.14),
      transparent 27%
    ),
    radial-gradient(
      circle at 10% 100%,
      rgba(82,111,168,.10),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #121d2d,
      #0a111d
    );

  box-shadow:
    0 30px 100px rgba(0,0,0,.25);
}

.event-card::after{
  content:"2026";

  position:absolute;

  right:-25px;
  bottom:-45px;

  font-size:150px;

  font-weight:950;

  color:rgba(255,255,255,.025);
}

.event-top{
  display:flex;

  justify-content:space-between;

  gap:20px;

  margin-bottom:30px;
}

.status{
  padding:6px 12px;

  border:1px solid rgba(217,184,108,.35);

  border-radius:999px;

  color:var(--gold2);

  font-size:9px;
  font-weight:900;

  letter-spacing:.13em;
}

.event-card h3{
  position:relative;
  z-index:2;

  font-size:clamp(38px,6vw,72px);

  line-height:.92;

  letter-spacing:-.06em;

  margin-bottom:20px;
}

.event-card p{
  position:relative;
  z-index:2;

  max-width:680px;

  color:var(--muted);

  font-size:16px;
}

.event-meta{
  display:flex;
  flex-wrap:wrap;

  gap:9px;

  margin:27px 0;
}

.meta{
  padding:7px 13px;

  border:1px solid var(--line);

  border-radius:999px;

  color:#c4cbd5;

  font-size:11px;

  background:rgba(255,255,255,.018);
}

@media(max-width:600px){

  .event-card{
    padding:30px;
  }

  .event-top{
    flex-direction:column;
  }

}

/* =========================================================
   MUN
========================================================= */

.mun{
  overflow:hidden;
}

.mun-card{
  position:relative;

  overflow:hidden;

  margin-top:50px;

  padding:60px;

  border:1px solid rgba(217,184,108,.25);

  border-radius:30px;

  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(217,184,108,.15),
      transparent 27%
    ),
    radial-gradient(
      circle at 20% 90%,
      rgba(82,111,168,.15),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #0d1625,
      #080e18
    );

  box-shadow:
    0 40px 100px rgba(0,0,0,.30);
}

.mun-card::before{
  content:"";

  position:absolute;

  width:350px;
  height:350px;

  right:-160px;
  top:-160px;

  border:1px solid rgba(217,184,108,.12);

  border-radius:50%;

  box-shadow:
    0 0 0 55px rgba(217,184,108,.025),
    0 0 0 110px rgba(217,184,108,.018);
}

.mun-header{
  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  gap:30px;

  margin-bottom:45px;
}

.mun-title{
  font-size:clamp(48px,7vw,88px);

  line-height:.88;

  letter-spacing:-.07em;

  margin-top:15px;
}

.mun-title span{
  color:var(--gold);
}

.coming{
  display:inline-block;

  margin-top:20px;

  color:var(--gold2);

  text-transform:uppercase;

  letter-spacing:.2em;

  font-size:10px;

  font-weight:900;
}

.mun-symbol{
  width:92px;
  height:92px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:50%;

  border:1px solid rgba(217,184,108,.55);

  color:var(--gold);

  font-size:31px;
  font-weight:950;

  background:
    radial-gradient(
      circle,
      rgba(217,184,108,.08),
      transparent 65%
    );

  box-shadow:
    0 0 45px rgba(217,184,108,.06);
}

.mun-description{
  position:relative;
  z-index:2;

  max-width:780px;

  color:var(--muted);

  font-size:18px;
}

.mun-tags{
  display:flex;
  flex-wrap:wrap;

  gap:9px;

  margin-top:30px;
}

.mun-tag{
  padding:8px 14px;

  border-radius:999px;

  background:rgba(255,255,255,.035);

  border:1px solid var(--line);

  color:#cbd1db;

  font-size:11px;
}

@media(max-width:700px){

  .mun-card{
    padding:32px;
  }

  .mun-header{
    flex-direction:column;
  }

}

/* =========================================================
   WHY SUTRA
========================================================= */

.why-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:15px;

  margin-top:50px;
}

.why-card{
  padding:32px;

  min-height:230px;
}

.card-number{
  color:var(--gold);

  font-size:10px;
  font-weight:900;

  letter-spacing:.15em;
}

.why-card h3{
  margin:30px 0 10px;

  font-size:21px;
}

.why-card p{
  color:var(--muted);

  font-size:14px;
}

@media(max-width:800px){

  .why-grid{
    grid-template-columns:1fr;
  }

}

/* =========================================================
   ROLES
========================================================= */

.roles-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:15px;

  margin-top:48px;
}

.role-card{
  padding:30px;

  min-height:200px;
}

.role-icon{
  color:var(--gold);

  font-size:27px;

  margin-bottom:25px;
}

.role-card h3{
  font-size:19px;

  margin-bottom:8px;
}

.role-card p{
  color:var(--muted);

  font-size:13px;
}

@media(max-width:850px){

  .roles-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  .roles-grid{
    grid-template-columns:1fr;
  }

}

/* =========================================================
   RESOURCES
========================================================= */

.resources{
  background:
    linear-gradient(
      180deg,
      transparent,
      rgba(82,111,168,.045),
      transparent
    );
}

.resource-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:15px;

  margin-top:48px;
}

.resource-card{
  padding:30px;

  position:relative;
}

.resource-card::before{
  content:"";

  position:absolute;

  top:0;
  left:30px;
  right:30px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );

  opacity:.5;
}

.resource-icon{
  font-size:27px;

  margin:10px 0 25px;

  color:var(--gold);
}

.resource-card h3{
  font-size:19px;

  margin-bottom:9px;
}

.resource-card p{
  color:var(--muted);

  font-size:13px;

  margin-bottom:20px;
}

.resource-link{
  color:var(--gold2);

  font-size:11px;

  font-weight:850;

  letter-spacing:.08em;

  text-transform:uppercase;
}

@media(max-width:800px){

  .resource-grid{
    grid-template-columns:1fr;
  }

}

/* =========================================================
   ASK SUTRA
========================================================= */

.ask{
  padding-top:80px;
}

.ask-card{
  display:grid;

  grid-template-columns:1fr 1.5fr;

  gap:50px;

  padding:50px;

  border-radius:28px;

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(217,184,108,.13),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012)
    );

  border:1px solid var(--line);
}

.ask-big{
  font-size:clamp(45px,6vw,72px);

  line-height:.9;

  letter-spacing:-.065em;
}

.ask-big span{
  color:var(--gold);
}

.ask-copy{
  color:var(--muted);

  font-size:16px;
}

.ask-question{
  margin-top:25px;

  padding:18px 20px;

  border:1px solid rgba(217,184,108,.2);

  border-radius:13px;

  background:rgba(217,184,108,.035);

  color:#dce0e7;

  font-size:14px;
}

@media(max-width:750px){

  .ask-card{
    grid-template-columns:1fr;

    padding:32px;

    gap:25px;
  }

}

/* =========================================================
   COMMUNITY
========================================================= */

.community{
  text-align:center;
}

.community-card{
  padding:65px 35px;

  margin-top:45px;

  border-radius:30px;

  border:1px solid rgba(217,184,108,.20);

  background:
    radial-gradient(
      circle at center,
      rgba(217,184,108,.09),
      transparent 45%
    ),
    rgba(255,255,255,.015);
}

.community-title{
  font-size:clamp(42px,7vw,80px);

  line-height:.9;

  letter-spacing:-.07em;

  margin:15px auto 22px;
}

.community-title span{
  color:var(--gold);
}

.community-card p{
  max-width:650px;

  margin:0 auto 30px;

  color:var(--muted);

  font-size:17px;
}

/* =========================================================
   AMBASSADOR
========================================================= */

.ambassador-grid{
  display:grid;

  grid-template-columns:1.2fr .8fr;

  gap:20px;

  margin-top:48px;
}

.ambassador-main{
  padding:45px;
}

.ambassador-main h3{
  font-size:34px;

  line-height:1;

  margin:15px 0;
}

.ambassador-main h3 span{
  color:var(--gold);
